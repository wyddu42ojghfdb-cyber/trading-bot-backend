<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - مراقبة المعاملات</title>
    <style>
        :root {
            --primary-color: #00c853;
            --danger-color: #b71c1c;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #3a3a3a;
            padding-bottom: 15px;
        }

        .admin-header h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin: 0 0 5px 0;
        }

        .admin-header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            background: #1b5e20;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
        }

        .requests-list {
            margin-top: 20px;
            min-height: 150px;
        }

        .request-card {
            background: #2a2a2a;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
        }

        .request-card.withdraw-type {
            border-left-color: var(--danger-color);
        }

        .request-card p {
            margin: 6px 0;
            font-size: 15px;
        }

        .request-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 10px;
        }

        .btn-clear {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-clear:hover {
            background: var(--danger-color);
            color: #fff;
        }

        .empty-message {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-style: italic;
        }

        .copy-btn {
            background: #444;
            border: none;
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            margin-right: 5px;
        }
        .copy-btn:hover { background: #555; }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <h1>لوحة تتبع المعاملات الحية</h1>
        <p>شاشة مراقبة طلبات الإيداع والسحب الخاصة بالمشرف</p>
        <div id="liveStatus" class="status-badge">جاري الاتصال بالسيرفر الحقيقي...</div>
    </div>

    <!-- قائمة عرض الطلبات المستلمة -->
    <div class="requests-list" id="requestsContainer">
        <div class="empty-message">شاشات المراقبة نظيفة، لا توجد طلبات معلقة حالياً</div>
    </div>

    <!-- زر تنظيف اللوحة -->
    <button class="btn-clear" onclick="clearAllRequests()">🗑️ تنظيف شاشة المراقبة ومسح السجلات</button>
</div>

<script>
    // الرابط الفعلي المحدث للـ API الخاص بالسيرفر على Vercel
    const getRequestsUrl = 'https://vercel.app';
    const clearRequestsUrl = 'https://vercel.app';

    // دالة لجلب الطلبات وعرضها تلقائياً
    function loadAdminRequests() {
        fetch(getRequestsUrl)
        .then(response => {
            if (!response.ok) throw new Error('فشل الاتصال');
            return response.json();
        })
        .then(requests => {
            document.getElementById('liveStatus').innerText = '🟢 متصل ومراقب حي';
            document.getElementById('liveStatus').style.backgroundColor = '#1b5e20';
            
            const container = document.getElementById('requestsContainer');
            container.innerHTML = ''; 

            if (requests.length === 0) {
                container.innerHTML = '<div class="empty-message">شاشات المراقبة نظيفة، لا توجد طلبات معلقة حالياً</div>';
                return;
            }

            // ترتيب الطلبات لتظهر الأحدث في الأعلى دائماً
            requests.reverse().forEach(req => {
                const isWithdraw = req.type === 'سحب';
                const cardClass = isWithdraw ? 'request-card withdraw-type' : 'request-card';
                const typeColor = isWithdraw ? '#ff5252' : '#00e676';

                const cardHtml = `
                    <div class="${cardClass}">
                        <p><strong>نوع العملية:</strong> <span style="color: ${typeColor}; font-weight: bold;">${req.type}</span></p>
                        <p><strong>المبلغ المطلوب:</strong> <span style="font-size: 18px; font-weight: bold; color: #fff;">${req.amount} USDT</span></p>
                        <p><strong>عنوان محفظة العميل:</strong> 
                            <span style="font-family: monospace; background: #111; padding: 4px; border-radius: 4px; font-size: 13px;">${req.wallet}</span>
                            <button class="copy-btn" onclick="navigator.clipboard.writeText('${req.wallet}'); alert('تم نسخ المحفظة!')">نسخ</button>
                        </p>
                        <div class="request-meta">
                            <span>حالة الطلب: ⏳ ${req.status}</span>
                            <span>توقيت الإرسال: ${req.date}</span>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        })
        .catch(error => {
            console.error('Error fetching admin logs:', error);
            document.getElementById('liveStatus').innerText = '🔴 خطأ في اتصال السيرفر';
            document.getElementById('liveStatus').style.backgroundColor = '#b71c1c';
        });
    }

    // دالة مسح جميع الطلبات من الشاشة والسيرفر
    function clearAllRequests() {
        if (confirm('هل أنت متأكد من رغبتك في حذف وتصفير جميع الطلبات الحالية من لوحة التحكم؟')) {
            fetch(clearRequestsUrl, { method: 'POST' })
            .then(() => {
                loadAdminRequests();
            })
            .catch(err => alert('تعذر تنظيف السجلات حالياً.'));
        }
    }

    // تحديث وتحديث الشاشة تلقائياً كل 4 ثوانٍ لجلب الطلبات فور حدوثها
    setInterval(loadAdminRequests, 4000);
    
    // تحميل الطلبات عند فتح الصفحة للمرة الأولى
    window.onload = loadAdminRequests;
</script>

</body>
</html>
