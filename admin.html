<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - نظام المزامنة الحية</title>
    <style>
        :root { 
            --primary-color: #00c853; 
            --danger-color: #b71c1c; 
            --bg-color: #121212; 
            --card-bg: #1e1e1e; 
            --gold-color: #ffd600;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background-color: var(--bg-color); 
            color: #fff; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
        }
        .admin-container { 
            width: 100%; 
            max-width: 600px; 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }
        .status-badge { 
            display: inline-block; 
            background: #1b5e20; 
            color: #fff; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-size: 12px; 
            margin-bottom: 15px; 
            font-weight: bold;
        }
        .btn-broadcast { 
            width: 100%; 
            padding: 15px; 
            background-color: var(--gold-color); 
            color: #000; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 15px rgba(255,214,0,0.2);
        }
        .btn-broadcast:hover { background-color: #ffea00; }
        .request-card { 
            background: #2a2a2a; 
            border-left: 4px solid var(--primary-color); 
            padding: 18px; 
            border-radius: 8px; 
            margin-bottom: 15px; 
            text-align: right;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .request-card.withdraw-type {
            border-left-color: var(--danger-color);
        }
        .request-card.invite-type {
            border-left-color: #7b1fa2;
        }
        .request-card p { 
            margin: 8px 0; 
            font-size: 15px; 
        }
        .wallet-container { 
            background: #111; 
            padding: 10px; 
            border-radius: 6px; 
            margin: 12px 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border: 1px solid #3a3a3a;
        }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-status { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
        .btn-approve { background-color: #2e7d32; color: white; }
        .btn-approve:hover { background-color: #1b5e20; }
        .btn-reject { background-color: #c62828; color: white; }
        .btn-reject:hover { background-color: #b71c1c; }
        .btn-clear { 
            width: 100%; 
            padding: 12px; 
            background: transparent; 
            border: 1px solid var(--danger-color); 
            color: var(--danger-color); 
            border-radius: 8px; 
            cursor: pointer; 
            margin-top: 20px; 
            font-weight: bold;
        }
        .btn-clear:hover { background: var(--danger-color); color: #fff; }
    </style>
</head>
<body>

<div class="admin-container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2>لوحة تتبع المعاملات الحية المتوافقة</h2>
        <div id="orderCount" style="font-size: 14px; color: #4fc3f7; margin-bottom: 10px; font-weight: bold;">إجمالي طلبات المنصة: 0</div>
        <div class="status-badge" id="liveStatusBadge">🟢 متصل ومزامن حياً مع المشتركين</div>
    </div>

    <!-- 📊 زر بث الأرباح 15% حياً للمشتركين -->
    <button class="btn-broadcast" onclick="broadcastTodayProfit()">📊 بث أرباح الصفقة اليومية (نسبة 15%)</button>
    
    <div id="requestsContainer">
        <p style="text-align:center; color:#aaa; font-style:italic;">جاري تحميل البيانات الحية السحابية...</p>
    </div>
    
    <button class="btn-clear" onclick="clearAllRequests()">🗑️ تنظيف شاشة المراقبة وتصفير السجلات</button>
</div>

<script>
    // 🌐 القناة السحابية الموحدة المشتركة مع واجهة المستخدم
    const channelUrl = 'https://jsonbin.io';
    const apiKey = '$2a$10$7R4b6/nJv/GskcZ.vNlO2uTskK0Jq6b19H7H9YhM8rR4n3CExZ6vS';

    function checkAdminAuth() {
        if (sessionStorage.getItem('is_admin_auth') === 'true') {
            loadAdminRequests();
            setInterval(loadAdminRequests, 2500);
            return;
        }
        const user = prompt("اسم المستخدم للمشرف:");
        const pass = prompt("كلمة المرور السرية للمشرف:");
        if (user === "admin" && pass === "admin123") {
            sessionStorage.setItem('is_admin_auth', 'true');
            loadAdminRequests();
            setInterval(loadAdminRequests, 2500);
        } else {
            alert("❌ بيانات الدخول خاطئة!");
            window.location.href = "index.html";
        }
    }

    function loadAdminRequests() {
        fetch(channelUrl, { headers: { 'X-Master-Key': apiKey }, cache: "no-cache" })
        .then(res => res.json())
        .then(resData => {
            const serverData = resData.record || { orders: [], balances: { capital: 0, todayProfit: 0, inviteProfit: 0, teamCount: 0 } };
            const orders = serverData.orders || [];
            
            document.getElementById('orderCount').innerText = `إجمالي طلبات المنصة: ${orders.length}`;
            const container = document.getElementById('requestsContainer');
            container.innerHTML = '';

            if(orders.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#aaa; font-style:italic;">شاشات المراقبة نظيفة، لا توجد طلبات معلقة حالياً</p>';
                return;
            }

            [...orders].reverse().forEach((req, index) => {
                const actualIndex = orders.length - 1 - index;
                
                let cardClass = 'request-card';
                if(req.type && req.type.includes('سحب')) cardClass = 'request-card withdraw-type';
                if(req.type && req.type.includes('مكافأة')) cardClass = 'request-card invite-type';
                
                let typeColor = '#00c853';
                if(cardClass.includes('withdraw-type')) typeColor = '#ff5252';
                if(cardClass.includes('invite-type')) typeColor = '#7b1fa2';
                
                let statusIcon = '⏳';
                let statusColor = '#fff';
                if (req.status === 'تم القبول') { statusIcon = '✅'; statusColor = '#00e676'; }
                if (req.status === 'تم الرفض') { statusIcon = '❌'; statusColor = '#ff5252'; }

                const cardHtml = `
                    <div class="${cardClass}">
                        <p><strong>صاحب الطلب (الداعي):</strong> <span style="color: #4fc3f7; font-weight: bold;">${req.username || 'غير مسجل'}</span></p>
                        <p><strong>نوع الإجراء المطلوب:</strong> <span style="color: ${typeColor}; font-weight: bold;">${req.type}</span></p>
                        <p><strong>المبلغ المالي:</strong> <span style="font-size: 16px; font-weight: bold; color: #fff;">${req.amount} USDT</span></p>
                        
                        <!-- 📋 حقل المحفظة أو أسماء الدعوة مع زر نسخ فوري -->
                        <div class="wallet-container">
                            <span style="font-size:13px; color:#ffb74d; font-family:monospace; word-break:break-all;">${req.wallet}</span>
                            <button style="padding:5px 10px; background:#0088cc; color:#fff; border:none; cursor:pointer; font-weight:bold; border-radius:4px;" onclick="navigator.clipboard.writeText('${req.wallet}'); alert('تم نسخ البيانات المحددة بنجاح!')">📋 نسخ</button>
                        </div>

                        <div class="action-buttons" style="${req.status !== 'معلق' ? 'display:none;' : ''}">
                            <button class="btn-status btn-approve" onclick="updateStatus(${actualIndex}, 'تم القبول', '${req.type}', ${req.amount}, serverData)">موافق 👍</button>
                            <button class="btn-status btn-reject" onclick="updateStatus(${actualIndex}, 'تم الرفض', '${req.type}', ${req.amount}, serverData)">رفض 👎</button>
                        </div>
                        <p style="font-size:12px; color:#aaa; margin-top:10px;">الحالة الحالية: <strong style="color:${statusColor}">${statusIcon} ${req.status}</strong> | التوقيت: ${req.date}</p>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }).catch(err => {
            document.getElementById('liveStatusBadge').innerText = '🔴 خطأ مزامنة مؤقت';
            document.getElementById('liveStatusBadge').style.backgroundColor = '#b71c1c';
        });
    }

    function updateStatus(index, newStatus, type, amount, serverData) {
        serverData.orders[index].status = newStatus;

        if (newStatus === 'تم القبول') {
            let bal = serverData.balances || { capital: 0, todayProfit: 0, inviteProfit: 0, teamCount: 0 };
            const num = parseFloat(amount) || 0;

            // تنفيذ الحسابات والعدادات حياً بناءً على نوع موافقة الأدمن
            if (type === 'إيداع رأس مال') {
                bal.capital += num;
            } else if (type === 'سحب رأس المال الكلّي') {
                bal.capital = Math.max(0, bal.capital - num);
            } else if (type === 'سحب أرباح اليوم') {
                bal.todayProfit = Math.max(0, bal.todayProfit - num);
            } else if (type === 'سحب أرباح الدعوة') {
                bal.inviteProfit = Math.max(0, bal.inviteProfit - num);
            } else if (type === 'طلب مكافأة دعوة صديق') {
