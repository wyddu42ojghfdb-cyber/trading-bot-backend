<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0b111e; color: #ffffff; margin: 0; padding: 20px; direction: rtl; }
        .admin-container { max-width: 1000px; margin: 0 auto; }
        h1, h2 { color: #2196f3; border-bottom: 2px solid #1e2d4a; padding-bottom: 10px; }
        .order-table { width: 100%; border-collapse: collapse; margin-top: 15px; background-color: #111a2e; border: 1px solid #1e2d4a; border-radius: 8px; overflow: hidden; margin-bottom: 30px; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #1e2d4a; }
        th { background-color: #1e2d4a; color: #90a4ae; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 5px; }
        .btn-success { background-color: #00e676; color: #000; }
        .btn-danger { background-color: #ff5252; color: #fff; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>🖥️ لوحة تحكم المشرف الحقيقية</h1>
        
        <h2>📥 طلبات الأعضاء المنتظرة</h2>
        <table class="order-table">
            <thead>
                <tr>
                    <th>اسم المستخدم</th>
                    <th>نوع الطلب</th>
                    <th>المبلغ / التفاصيل</th>
                    <th>المحفظة / الصديق</th>
                    <th>القرار</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody"></tbody>
        </table>

        <h2>📊 مراقبة أرصدة وأرصدة الأرباح والمكافآت الحالية لكل الأعضاء</h2>
        <table class="order-table">
            <thead>
                <tr>
                    <th>اسم المستخدم</th>
                    <th>رأس المال الكلي</th>
                    <th>أرباح اليوم</th>
                    <th>أرباح المكافآت 🎁</th>
                    <th>عدد الفريق</th>
                </tr>
            </thead>
            <tbody id="profitsTableBody"></tbody>
        </table>
    </div>

<script>
    function refreshLiveAdminData() {
        // 1. جلب الطلبات المعلقة من السيرفر
        fetch('http://localhost:3000/api/admin/orders')
        .then(res => res.json())
        .then(orders => {
            const tbody = document.getElementById('ordersTableBody');
            tbody.innerHTML = orders.length === 0 ? `<tr><td colspan="5" style="text-align:center;color:#90a4ae;">لا توجد طلبات معلقة حالياً...</td></tr>` : '';
            orders.forEach(order => {
                tbody.innerHTML += `
                    <tr>
                        <td style="color:#4fc3f7; font-weight:bold;">${order.username}</td>
                        <td>${order.type}</td>
                        <td>${order.amount ? order.amount + ' USDT' : 'طلب مكافأة'}</td>
                        <td>${order.wallet ? order.wallet : order.friendName}</td>
                        <td>
                            <button class="btn btn-success" onclick="takeAction('${order.id}', 'accept')">✅ قبول</button>
                            <button class="btn btn-danger" onclick="takeAction('${order.id}', 'reject')">❌ رفض</button>
                        </td>
                    </tr>`;
            });
        });

        // 2. جلب الأرصدة المحدثة والأرباح والمكافآت الحية من السيرفر
        fetch('http://localhost:3000/api/admin/users-profits')
        .then(res => res.json())
        .then(users => {
            const tbody = document.getElementById('profitsTableBody');
            tbody.innerHTML = Object.keys(users).length === 0 ? `<tr><td colspan="5" style="text-align:center;color:#90a4ae;">لا توجد بيانات مسجلة...</td></tr>` : '';
            for (let username in users) {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${username}</b></td>
                        <td style="color:#ffb74d;">USDT ${users[username].capital.toFixed(2)}</td>
                        <td style="color:#00e676;">USDT ${users[username].todayProfit.toFixed(2)}</td>
                        <td style="color:#ba68c8;">USDT ${users[username].inviteProfit.toFixed(2)}</td>
                        <td>${users[username].teamCount} أعضاء</td>
                    </tr>`;
            }
        });
    }

    function takeAction(orderId, action) {
        fetch('http://localhost:3000/api/admin/action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId, action })
        })
        .then(res => res.json())
        .then(data => { if(data.success) refreshLiveAdminData(); });
    }

    setInterval(refreshLiveAdminData, 2000);
    window.onload = refreshLiveAdminData;
</script>
</body>
</html>
