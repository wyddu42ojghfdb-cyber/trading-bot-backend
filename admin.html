<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - الإدارة الاستراتيجية</title>
    <script src="https://tailwindcss.com"></script>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #060b13; color: #f3f4f6; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto space-y-6">
        <div class="bg-slate-900 p-6 rounded-2xl border border-red-900/40 shadow-2xl text-center relative overflow-hidden">
            <div class="absolute top-0 right-0 left-0 h-[3px] bg-gradient-to-r from-red-500 via-yellow-500 to-red-500"></div>
            <h1 class="text-xl font-bold text-red-400 mb-1">🛡️ غرفة التحكم والمراقبة المركزية</h1>
            <p class="text-xs text-gray-500">خاص بالمشرفين المعتمدين فقط - عمليات السيرفر المباشرة</p>
        </div>

        <!-- زر الصفقة السحري اليومي -->
        <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800 shadow-xl text-center space-y-4">
            <div class="space-y-1">
                <h2 class="text-lg font-bold text-yellow-400">⚡ زر الصفقة السحري اليومي</h2>
                <p class="text-xs text-gray-400">عند الضغط: يقوم السيرفر بحساب وإضافة ربح صافي بقيمة <span class="text-green-400 font-bold">15%</span> لكل الحسابات النشطة، ويوزع عمولة إحالة بقيمة <span class="text-blue-400 font-bold">20%</span> للمستضيف تلقائياً.</p>
            </div>

            <div class="py-4">
                <button onclick="triggerMagicButton()" id="magicBtn" class="w-full max-w-md bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-slate-950 font-black text-lg p-5 rounded-2xl shadow-lg shadow-yellow-500/10 active:scale-[0.98] transition-all duration-150">
                    🚀 تفعيل الصفقة وضخ الأرباح الحية
                </button>
            </div>
            
            <div id="magicStatus" class="text-xs hidden p-3 rounded-xl bg-slate-950 border border-slate-800"></div>
        </div>
    </div>

    <script>
        // تم ربط السيرفر السحابي الحي الخاص بك هنا بنجاح
        const BACKEND_URL = "https://onrender.com"; 

        async function triggerMagicButton() {
            const magicBtn = document.getElementById('magicBtn');
            const statusDiv = document.getElementById('magicStatus');

            if(!confirm("هل أنت متأكد من رغبتك في ضخ أرباح اليوم بنسبة 15% لجميع الحسابات؟")) return;

            magicBtn.disabled = true;
            magicBtn.innerText = "⏳ جاري المعالجة الحسابية وضخ الأرباح...";
            
            statusDiv.classList.remove('hidden');
            statusDiv.className = "text-xs p-3 rounded-xl bg-slate-950 border border-yellow-500/20 text-yellow-400 text-center";
            statusDiv.innerText = "السيرفر يقوم الآن بتحديث الحسابات وحساب عمولات الإحالة الـ 20%...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/magic-button`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const data = await response.json();

                if(response.ok) {
                    statusDiv.className = "text-xs p-3 rounded-xl bg-slate-950 border border-green-500/20 text-green-400 font-bold text-center";
                    statusDiv.innerText = "✅ " + data.message;
                } else {
                    statusDiv.className = "text-xs p-3 rounded-xl bg-slate-950 border border-red-500/20 text-red-400 text-center";
                    statusDiv.innerText = "❌ فشل الإجراء: " + data.error;
                }
            } catch (err) {
                statusDiv.className = "text-xs p-3 rounded-xl bg-slate-950 border border-red-500/20 text-red-400 text-center";
                statusDiv.innerText = "❌ خطأ: لم يتم العثور على استجابة حيّة من السيرفر المركزي.";
            } {
                magicBtn.disabled = false;
                magicBtn.innerText = "🚀 تفعيل الصفقة وضخ الأرباح الحية";
            }
        }
    </script>
</body>
</html>
