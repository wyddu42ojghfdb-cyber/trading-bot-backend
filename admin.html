<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف</title>
    <style>
        :root { --primary-color: #00c853; --danger-color: #b71c1c; --bg-color: #121212; --card-bg: #1e1e1e; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: #fff; padding: 20px; display: flex; justify-content: center; }
        .admin-container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 30px; border-radius: 16px; }
        .status-badge { display: inline-block; background: #1b5e20; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 15px; }
        .btn-broadcast { width: 100%; padding: 15px; background-color: #ffd600; color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .request-card { background: #2a2a2a; border-left: 4px solid var(--primary-color); padding: 18px; border-radius: 8px; margin-bottom: 15px; }
        .wallet-container { background: #111; padding: 10px; border-radius: 6px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-status { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-approve { background-color: #2e7d32; color: white; }
        .btn-reject { background-color: #c62828; color: white; }
        .btn-clear { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<div class="admin-container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2>لوحة تتبع المعاملات السحابية الحية</h2>
        <div class="status-badge">🟢 متصل بالسيرفر السحابي المباشر</div>
    </div>

    <button class="btn-broadcast" onclick="broadcastTodayProfit()">📊 بث أرباح الصفقة اليومية (نسبة 15%)</button>
    <div id="requestsContainer"></div>
    <button class="btn-clear" onclick="clearAllRequests()">🗑️ تنظيف السجلات</button>
</div>

<script>
    const baseUrl = 'https://vercel.app';

    function loadAdminRequests() {
        fetch(`${baseUrl}/requests`)
        .then(res => res.json())
        .then(requests => {
            const container = document.getElementById('requestsContainer');
            container.innerHTML = '';
            if(requests.length === 0) { container.innerHTML = '<p style="text-align:center; color:#aaa;">لا توجد طلبات معلقة</p>'; return; }

            [...requests].reverse().forEach(req => {
                const typeColor = req.type.includes('سحب') ? '#ff5252' : '#00e676';
                const cardHtml = `
                    <div class="request-card" style="border-left-color: ${typeColor}">
                        <p><strong>نوع العملية:</strong> <span style="color: ${typeColor}">${req.type}</span></p>
                        <p><strong>المبلغ:</strong> ${req.amount} USDT</p>
                        <div class="wallet-container">
                            <span style="font-size:13px; color:#ffb74d;">${req.wallet}</span>
                            <button style="padding:4px 8px; background:#444; color:#fff; border:none; cursor:pointer;" onclick="navigator.clipboard.writeText('${req.wallet}'); alert('تم النسخ')">نسخ</button>
                        </div>
                        <div class="action-buttons" style="${req.status !== 'معلق' ? 'display:none;' : ''}">
                            <button class="btn-status btn-approve" onclick="updateStatus(${req.id}, 'تم القبول')">موافق 👍</button>
                            <button class="btn-status btn-reject" onclick="updateStatus(${req.id}, 'تم الرفض')">رفض 👎</button>
                        </div>
                        <p style="font-size:12px; color:#aaa; margin-top:10px;">الحالة: <strong>${req.status}</strong> | التوقيت: ${req.date}</p>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        });
    }

    function updateStatus(id, newStatus) {
        fetch(`${baseUrl}/update-status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id, newStatus: newStatus })
        }).then(() => loadAdminRequests());
    }

    function broadcastTodayProfit() {
        fetch(`${baseUrl}/broadcast`, { method: 'POST' })
        .then(res => res.json())
        .then(data => { if(data.success) { alert('تم بث الأرباح 15% بنجاح سحابي!'); } else { alert('رأس المال فارغ'); } });
    }

    function clearAllRequests() {
        if(confirm('تأكيد مسح السجلات؟')) fetch(`${baseUrl}/clear`, { method: 'POST' }).then(() => loadAdminRequests());
    }

    setInterval(loadAdminRequests, 2500);
    window.onload = loadAdminRequests;
</script>
</body>
</html>
