<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف</title>
    <style>
        :root { --primary-color: #00c853; --danger-color: #b71c1c; --bg-color: #121212; --card-bg: #1e1e1e; --gold-color: #ffd600;}
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: #fff; padding: 20px; display: flex; justify-content: center; }
        .admin-container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 30px; border-radius: 16px; }
        .status-badge { display: inline-block; background: #1b5e20; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 15px; }
        .btn-broadcast { width: 100%; padding: 15px; background-color: var(--gold-color); color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .request-card { background: #2a2a2a; border-left: 4px solid var(--primary-color); padding: 18px; border-radius: 8px; margin-bottom: 15px; }
        .wallet-container { background: #111; padding: 10px; border-radius: 6px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-status { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-approve { background-color: #2e7d32; color: white; }
        .btn-reject { background-color: #c62828; color: white; }
        .btn-clear { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="admin-container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2>لوحة تتبع المعاملات السحابية الحية</h2>
        <!-- 📈 إظهار إجمالي عدد الطلبات حياً -->
        <div id="orderCount" style="font-size: 14px; color: #4fc3f7; margin-bottom: 10px;">إجمالي طلبات المنصة: 0</div>
        <div class="status-badge">🟢 متصل بشبكة جوجل الدائمة (Firebase)</div>
    </div>

    <button class="btn-broadcast" onclick="broadcastTodayProfit()">📊 بث أرباح الصفقة اليومية (نسبة 15%)</button>
    <div id="requestsContainer"></div>
    <button class="btn-clear" onclick="clearAllRequests()">🗑️ تنظيف السجلات</button>
</div>

<script>
    const dbUrl = 'https://trading-bot-6f5df-default-rtdb.firebaseio.com';

    function loadAdminRequests() {
        fetch(`${dbUrl}/orders.json`)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('requestsContainer');
            container.innerHTML = '';
            
            if(!data) { 
                document.getElementById('orderCount').innerText = "إجمالي طلبات المنصة: 0";
                container.innerHTML = '<p style="text-align:center; color:#aaa;">شاشات المراقبة نظيفة، لا توجد طلبات</p>'; 
                return; 
            }

            const keys = Object.keys(data);
            document.getElementById('orderCount').innerText = `إجمالي طلبات المنصة: ${keys.length}`;

            keys.reverse().forEach(key => {
                const req = data[key];
                const typeColor = req.type.includes('سحب') ? '#ff5252' : '#00e676';
                
                const cardHtml = `
                    <div class="request-card" style="border-left-color: ${typeColor}">
                        <p><strong>اسم العضو المرسل:</strong> <span style="color: #4fc3f7; font-weight: bold;">${req.username || 'لاعب حقيقي'}</span></p>
                        <p><strong>نوع العملية:</strong> <span style="color: ${typeColor}">${req.type}</span></p>
                        <p><strong>المبلغ:</strong> ${req.amount} USDT</p>
                        <div class="wallet-container">
                            <span style="font-size:13px; color:#ffb74d; word-break:break-all;">${req.wallet}</span>
                            <button style="padding:4px 8px; background:#444; color:#fff; border:none; cursor:pointer;" onclick="navigator.clipboard.writeText('${req.wallet}'); alert('تم النسخ')">نسخ</button>
                        </div>
                        <div class="action-buttons" style="${req.status !== 'معلق' ? 'display:none;' : ''}">
                            <button class="btn-status btn-approve" onclick="updateStatus('${key}', 'تم القبول', '${req.type}', ${req.amount})">موافق 👍</button>
                            <button class="btn-status btn-reject" onclick="updateStatus('${key}', 'تم الرفض')">رفض 👎</button>
                        </div>
                        <p style="font-size:12px; color:#aaa; margin-top:10px;">الحالة: <strong>${req.status}</strong> | التوقيت: ${req.date}</p>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        });
    }

    function updateStatus(key, newStatus, type, amount) {
        fetch(`${dbUrl}/orders/${key}.json`, {
            method: 'PATCH',
            body: JSON.stringify({ status: newStatus })
        })
        .then(() => {
            if (newStatus === 'تم القبول') {
                fetch(`${dbUrl}/balances.json`)
                .then(res => res.json())
                .then(balance => {
                    let current = balance || { capital: 0, todayProfit: 0, inviteProfit: 0 };
                    const numAmount = parseFloat(amount) || 0;

                    if (type === 'إيداع') current.capital += numAmount;
                    else if (type === 'سحب كلّي') current.capital = 0;
                    else if (type === 'سحب اليوم') current.todayProfit -= numAmount;

                    fetch(`${dbUrl}/balances.json`, { method: 'PUT', body: JSON.stringify(current) });
                });
            }
            setTimeout(loadAdminRequests, 500);
        });
    }

    function broadcastTodayProfit() {
        fetch(`${dbUrl}/balances.json`)
        .then(res => res.json())
        .then(balance => {
            let current = balance || { capital: 0, todayProfit: 0, inviteProfit: 0 };
            if (current.capital <= 0) return alert('رأس مال المشتركين صفر!');
            
            const profit = current.capital * 0.15;
            current.todayProfit += profit;

            fetch(`${dbUrl}/balances.json`, { method: 'PUT', body: JSON.stringify(current) })
            .then(() => alert(`تم بث أرباح الصفقة اليومية 15% بمجموع مضاف: ${profit.toFixed(2)} USDT`));
        });
    }

    function clearAllRequests() {
        if(confirm('تأكيد مسح السجلات؟')) fetch(`${dbUrl}/orders.json`, { method: 'DELETE' }).then(() => loadAdminRequests());
    }

    setInterval(loadAdminRequests, 2000);
    window.onload = loadAdminRequests;
</script>
</body>
</html>
