<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - الإدارة الاستراتيجية</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #060b13; color: #f3f4f6; }
    </style>
</head>
<body class="p-4 bg-black">

    <div class="max-w-2xl mx-auto space-y-6 mt-4">
        <!-- هيدر لوحة التحكم -->
        <div class="bg-gray-900 p-6 rounded-2xl border border-red-900 shadow-2xl text-center">
            <h1 class="text-xl font-bold text-red-400 mb-1">🛡️ غرفة التحكم والمراقبة المركزية</h1>
            <p class="text-xs text-gray-500">خاص بالمشرفين - إدارة العمليات الحية للملايين</p>
        </div>

        <!-- زر الصفقة السحري اليومي -->
        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl text-center space-y-4">
            <h2 class="text-lg font-bold text-yellow-400">⚡ زر الصفقة السحري اليومي</h2>
            <p class="text-xs text-gray-400">اضغط لضخ أرباح صافية بقيمة <span class="text-green-400 font-bold">15%</span> لجميع الحسابات.</p>
            <button onclick="triggerMagicButton()" id="magicBtn" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold p-4 rounded-xl text-md transition-all">
                🚀 تفعيل الصفقة وضخ الأرباح الحية
            </button>
            <div id="magicStatus" class="text-xs hidden p-3 rounded-xl bg-black border border-gray-800 text-yellow-400"></div>
        </div>

        <!-- شاشة مراقبة طلبات الإيداع الحية الحقيقية -->
        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800 shadow-xl">
            <h2 class="text-md font-bold text-gray-400 mb-4">📑 طلبات الإيداع الحالية (حياً من قاعدة البيانات)</h2>
            <div id="txList" class="space-y-3 text-sm">
                <p class="text-gray-500 italic text-center py-4">جاري جلب الطلبات الحية من السيرفر...</p>
            </div>
        </div>
    </div>

    <script>
        // ضع رابط السيرفر الفعلي الخاص بك هنا
        const BACKEND_URL = "https://onrender.com"; 

        async function fetchLiveRequests() {
            const txListDiv = document.getElementById('txList');
            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/requests`);
                const requests = await response.json();

                if (requests.length === 0) {
                    txListDiv.innerHTML = `<p class="text-gray-500 italic text-center py-4">🟢 لا توجد أي طلبات إيداع معلقة حالياً.</p>`;
                    return;
                }

                txListDiv.innerHTML = ""; 
                requests.forEach(req => {
                    txListDiv.innerHTML += `
                        <div class="p-4 bg-black rounded-xl border border-gray-800 flex justify-between items-center shadow-md">
                            <div>
                                <p class="text-yellow-400 font-bold text-base">👤 العميل: ${req.username}</p>
                                <p class="text-xs text-gray-400 mt-1">💰 المبلغ: <span class="text-green-400 font-bold">${req.amount} USDT</span></p>
                                <p class="text-[10px] text-gray-500 font-mono mt-1 break-all">💳 المحفظة: ${req.cryptoAddress}</p>
                            </div>
                            <div class="flex gap-2">
                                <button onclick="processRequest('${req._id}', 'approve')" class="bg-green-600 hover:bg-green-700 text-white font-bold px-3 py-2 rounded-lg text-xs transition-all">موافقة</button>
                                <button onclick="processRequest('${req._id}', 'reject')" class="bg-red-600 hover:bg-red-700 text-white font-bold px-3 py-2 rounded-lg text-xs transition-all">رفض</button>
                            </div>
                        </div>
                    `;
                });
            } catch (err) {
                txListDiv.innerHTML = `<p class="text-red-400 text-center text-xs">❌ خطأ في جلب البيانات تلقائياً...</p>`;
            }
        }

        async function processRequest(id, action) {
            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/action`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id, action })
                });
                const data = await response.json();
                if(response.ok) {
                    alert("✅ تم تنفيذ القرار بنجاح وتحديث حساب العميل!");
                    fetchLiveRequests();
                } else {
                    alert("❌ خطأ: " + data.error);
                }
            } catch (err) {
                alert("❌ فشل الاتصال بالسيرفر لتنفيذ القرار.");
            }
        }
        
        fetchLiveRequests();
        setInterval(fetchLiveRequests, 5000);

        async function triggerMagicButton() {
            const magicBtn = document.getElementById('magicBtn');
            const statusDiv = document.getElementById('magicStatus');

            if(!confirm("هل أنت متأكد من رغبتك في ضخ أرباح اليوم بنسبة 15%؟")) return;

            magicBtn.disabled = true;
            magicBtn.innerText = "⏳ جاري ضخ الأرباح والعمولات...";
            statusDiv.classList.remove('hidden');

            try {
                const response = await fetch(`${BACKEND_URL}/api/admin/magic-button`, { method: 'POST' });
                const data = await response.json();
                if(response.ok) {
                    statusDiv.innerText = "✅ " + data.message;
                } else {
                    statusDiv.innerText = "❌ فشل الإجراء: " + data.error;
                }
            } catch (err) {
                statusDiv.innerText = "❌ فشل تنفيذ العملية الجماعية السحابية.";
            } finally {
                magicBtn.disabled = false;
                magicBtn.innerText = "🚀 تفعيل الصفقة وضخ الأرباح الحية";
            }
        }
    </script>
</body>
</html>
