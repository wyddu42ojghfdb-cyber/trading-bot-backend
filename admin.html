<!DOCTYPE html>
<html lang="ar" dir="rtl" class="notranslate" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="google" content="notranslate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف المركزي</title>
    <style>
        body { background-color: #0b0f19; color: #fff; font-family: sans-serif; padding: 15px; text-align: center; }
        .card { background-color: #151d30; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #233253; }
        button { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; border-radius: 5px; border: none; font-weight: bold; cursor: pointer; }
        .btn-magic { background: #fd7e14; color: white; font-size: 16px; box-shadow: 0 4px 15px rgba(253, 126, 20, 0.3); }
        .btn-approve { background: #28a745; color: white; width: 45%; margin: 2%; display: inline-block; padding: 8px; }
        .btn-reject { background: #dc3545; color: white; width: 45%; margin: 2%; display: inline-block; padding: 8px; }
        .val { font-size: 24px; color: #ffc107; margin-top: 5px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        th, td { padding: 10px; border: 1px solid #233253; text-align: center; }
        th { background: #1f2b45; color: #4e97ff; }
        .status-box { background: #1f2b45; padding: 10px; border-radius: 5px; margin-top: 5px; display: inline-block; width: 45%; margin-right: 2%; }
        input { background: #0b0f19; color: white; border: 1px solid #233253; padding: 6px; border-radius: 4px; text-align: center; width: 80px; }
    </style>
</head>
<body>

    <div class="card" style="border-color: #fd7e14;">
        <h2>⚙️ لوحة تتبع وإدارة عمليات المنصة الحية</h2>
        <button class="btn-magic" onclick="triggerMagic()">🚀 تفعيل وتوزيع أرباح الصفقة الحالية (+15%)</button>
    </div>

    <div class="card">
        <span>📊 إحصائيات النشاط العام للمشتركين الحالية:</span>
        <br>
        <div class="status-box">🟢 نشط: <span id="activeCount" style="color:#28a745; font-weight:bold;">0</span></div>
        <div class="status-box">🔴 غير نشط: <span id="inactiveCount" style="color:#dc3545; font-weight:bold;">0</span></div>
    </div>

    <div class="card" style="border-color: #4e97ff;">
        <h3>📥 طلبات الأعضاء المعلقة الحالية (إيداع / سحب / مكافآت):</h3>
        <table>
            <thead>
                <tr>
                    <th>اسم العضو</th>
                    <th>نوع الطلب</th>
                    <th>المبلغ / التفاصيل</th>
                    <th>المحفظة الذكية (TRC-20)</th>
                    <th>التحكم والموافقة</th>
                </tr>
            </thead>
            <tbody id="requestTable">
                <tr><td colspan="5">شاشات المراقبة نظيفة، لا توجد طلبات معلقة حالياً</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        async function fetchAdminData() {
            try {
                var statsRes = await fetch('/api/admin/stats');
                var stats = await statsRes.json();
                document.getElementById('activeCount').textContent = stats.active;
                document.getElementById('inactiveCount').textContent = stats.inactive;

                var reqRes = await fetch('/api/admin/requests/pending');
                var reqData = await reqRes.json();
                var tableBody = document.getElementById('requestTable');
                tableBody.innerHTML = '';

                if (reqData.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5">شاشات المراقبة نظيفة، لا توجد طلبات معلقة حالياً</td></tr>';
                } else {
                    reqData.forEach(function(item) {
                        var typeText = '';
                        var detailsText = item.amount + ' USDT';
                        
                        if (item.type === 'deposit') typeText = '📥 إيداع رأس مال';
                        if (item.type === 'balance') typeText = '💸 سحب كلي';
                        if (item.type === 'today') typeText = '📈 سحب أرباح اليوم';
                        if (item.type === 'referral') typeText = '👥 سحب أرباح دعوة';
                        if (item.type === 'referral_bonus') {
                            typeText = '🎁 طلب مكافأة دعوة';
                            detailsText = 'دعا العضو: <span style="color:#ffc107;">' + item.invitedUser + '</span>';
                        }

                        var walletText = item.wallet ? item.wallet : '---';
                        var actionHtml = '';

                        if (item.type === 'referral_bonus') {
                            actionHtml = '<input type="number" id="bonus_' + item.id + '" placeholder="المكافأة" value="10"> ' +
                                         '<br><button class="btn-approve" onclick="processRequest(' + item.id + ', \'approve\')">موافق</button>' +
                                         '<button class="btn-reject" onclick="processRequest(' + item.id + ', \'reject\')">رفض</button>';
                        } else {
                            actionHtml = '<button class="btn-approve" onclick="processRequest(' + item.id + ', \'approve\')">موافق</button>' +
                                         '<button class="btn-reject" onclick="processRequest(' + item.id + ', \'reject\')">رفض</button>';
                        }

                        tableBody.innerHTML += '<tr>' +
                            '<td style="font-weight:bold; color:#4e97ff;">' + item.username + '</td>' +
                            '<td>' + typeText + '</td>' +
                            '<td>' + detailsText + '</td>' +
                            '<td style="color:#ffc107; font-family:monospace; font-size:11px;">' + walletText + '</td>' +
                            '<td>' + actionHtml + '</td>' +
                            '</tr>';
                    });
                }
            } catch (e) { console.error("خطأ في جلب بيانات المشرف:", e); }
        }

        async function processRequest(id, action) {
            var bonusInput = document.getElementById('bonus_' + id);
            var customBonus = bonusInput ? bonusInput.value : 0;

            try {
                var res = await fetch('/api/admin/process-request', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: id, action: action, customBonus: customBonus })
                });
                var data = await res.json();
                alert(data.message);
                fetchAdminData();
            } catch (e) { alert("فشلت العملية"); }
        }

        async function triggerMagic() {
            if (!confirm("هل أنت متأكد من رغبتك في توزيع أرباح بنسبة 15% على جميع الأعضاء النشطين الآن؟")) return;
            try {
                var res = await fetch('/api/admin/magic-button', { method: 'POST' });
                var data = await res.json();
                alert(data.message);
                fetchAdminData();
            } catch (e) { alert("فشلت عملية توزيع الأرباح"); }
        }

        fetchAdminData();
        setInterval(fetchAdminData, 3000);
    </script>
</body>
</html>
