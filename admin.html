<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - إدارة الطلبات</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #0b111e; color: #ffffff; margin: 0; padding: 20px; direction: rtl; }
        .admin-container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #2196f3; font-size: 24px; border-bottom: 2px solid #1e2d4a; padding-bottom: 10px; }
        .order-table { width: 100%; border-collapse: collapse; margin-top: 20px; background-color: #111a2e; border: 1px solid #1e2d4a; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: right; border-bottom: 1px solid #1e2d4a; }
        th { background-color: #1e2d4a; color: #90a4ae; font-size: 14px; }
        td { font-size: 15px; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-left: 5px; transition: opacity 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-success { background-color: #00e676; color: #000; }
        .btn-danger { background-color: #ff5252; color: #fff; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-deposit { background-color: #f57c00; color: white; }
        .badge-withdraw { background-color: #d32f2f; color: white; }
        .badge-invite { background-color: #7b1fa2; color: white; }
        .no-orders { text-align: center; color: #90a4ae; padding: 30px; font-style: italic; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>🖥️ لوحة تحكم المشرف الفورية</h1>
        <p style="color: #90a4ae;">تظهر هنا طلبات الإيداع، السحب، ومكافآت الدعوة تلقائياً للتحكم بها:</p>

        <table class="order-table">
            <thead>
                <tr>
                    <th>اسم المستخدم</th>
                    <th>نوع الطلب</th>
                    <th>المبلغ / التفاصيل</th>
                    <th>عنوان المحفظة / الصديق</th>
                    <th>الإجراءات والقرارات</th>
                </tr>
            </thead>
            <tbody id="ordersTableBody">
                <!-- يتم تحميل الطلبات هنا تلقائياً بواسطة الجافاسكربت -->
            </tbody>
        </table>
    </div>

<script>
    // دالة لجلب الطلبات المعلقة من السيرفر وعرضها فوراً
    function fetchLiveOrders() {
        fetch('/api/admin/orders')
        .then(res => res.json())
        .then(orders => {
            const tbody = document.getElementById('ordersTableBody');
            if (orders.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="no-orders">☕ لا توجد طلبات جديدة معلقة حالياً... الجدول نظيف!</td></tr>`;
                return;
            }

            tbody.innerHTML = ''; // تفريغ الجدول لإعادة البناء
            orders.forEach(order => {
                let badgeClass = 'badge-deposit';
                if(order.type === 'سحب') badgeClass = 'badge-withdraw';
                if(order.type === 'مكافأة دعوة') badgeClass = 'badge-invite';

                const details = order.amount ? `${order.amount} USDT` : 'طلب إضافة عضو';
                const extraInfo = order.wallet ? order.wallet : `الصديق: ${order.friendName}`;

                const row = `
                    <tr>
                        <td style="font-weight: bold; color: #4fc3f7;">${order.username}</td>
                        <td><span class="badge ${badgeClass}">${order.type}</span></td>
                        <td style="color: #00e676; font-weight: bold;">${details}</td>
                        <td style="font-family: monospace; color: #ffb74d;">${extraInfo}</td>
                        <td>
                            <button class="btn btn-success" onclick="takeAction('${order.id}', 'accept')">✅ قبول</button>
                            <button class="btn btn-danger" onclick="takeAction('${order.id}', 'reject')">❌ رفض</button>
                        </td>
                    </tr>
                `;
                tbody.innerHTML += row;
            });
        })
        .catch(err => console.log('في انتظار اتصال السيرفر...'));
    }

    // إرسال قرار المشرف (قبول/رفض) إلى السيرفر ليتم تحديث رصيد المستخدم فوراً
    function takeAction(orderId, action) {
        fetch('/api/admin/action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ orderId, action })
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                alert(action === 'accept' ? '🎯 تم قبول الطلب وتحديث رصيد الحساب!' : '❌ تم رفض الطلب وإلغاؤه.');
                fetchLiveOrders(); // تحديث الجدول فوراً
            }
        })
        .catch(err => alert('حدث خطأ أثناء تنفيذ الإجراء.'));
    }

    // تشغيل الفحص الدوري كل ثانيتين للتحديث الفوري والحيوي
    setInterval(fetchLiveOrders, 2000);
    window.onload = fetchLiveOrders;
</script>
</body>
</html>
