<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف</title>
    <style>
        :root { --primary-color: #00c853; --danger-color: #b71c1c; --bg-color: #121212; --card-bg: #1e1e1e; --gold-color: #ffd600;}
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: #fff; padding: 20px; display: flex; justify-content: center; }
        .admin-container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .status-badge { display: inline-block; background: #1b5e20; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 15px; }
        .btn-broadcast { width: 100%; padding: 15px; background-color: var(--gold-color); color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(255,214,0,0.2); }
        .request-card { background: #2a2a2a; border-left: 4px solid var(--primary-color); padding: 18px; border-radius: 8px; margin-bottom: 15px; }
        .wallet-container { background: #111; padding: 10px; border-radius: 6px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-status { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-approve { background-color: #2e7d32; color: white; }
        .btn-reject { background-color: #c62828; color: white; }
        .btn-clear { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="admin-container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2>لوحة تتبع المعاملات الحية المحدثة</h2>
        <div id="orderCount" style="font-size: 14px; color: #4fc3f7; margin-bottom: 10px; font-weight: bold;">إجمالي طلبات المنصة: 0</div>
        <div class="status-badge" id="liveStatusBadge">🟢 متصل وشبكة الاتصال نشطة</div>
    </div>

    <button class="btn-broadcast" onclick="broadcastTodayProfit()">📊 بث أرباح الصفقة اليومية (نسبة 15%)</button>
    <div id="requestsContainer"></div>
    <button class="btn-clear" onclick="clearAllRequests()">🗑️ تنظيف شاشة المراقبة وتصفير السجلات</button>
</div>

<script>
    const backupServerUrl = 'https://vercel.app';

    function loadAdminRequests() {
        fetch(`${backupServerUrl}/requests`)
        .then(res => res.json())
        .then(requests => {
            const container = document.getElementById('requestsContainer');
            container.innerHTML = '';
            
            if(!requests || requests.length === 0) { 
                document.getElementById('orderCount').innerText = "إجمالي طلبات المنصة: 0";
                container.innerHTML = '<p style="text-align:center; color:#aaa; font-style:italic;">شاشات المراقبة نظيفة، لا توجد طلبات معلقة</p>'; 
                return; 
            }

            document.getElementById('orderCount').innerText = `إجمالي طلبات المنصة: ${requests.length}`;

            [...requests].reverse().forEach(req => {
                const typeColor = req.type.includes('سحب') ? '#ff5252' : '#00e676';
                
                const cardHtml = `
                    <div class="request-card" style="border-left-color: ${typeColor}">
                        <p><strong>تفاصيل العملية المرسلة:</strong></p>
                        <p><strong>النوع والمصدر:</strong> <span style="color: ${typeColor}; font-weight: bold;">${req.type}</span></p>
                        <p><strong>المبلغ المالي:</strong> <span style="font-size: 16px; font-weight: bold; color: #fff;">${req.amount} USDT</span></p>
                        <div class="wallet-container">
                            <span style="font-size:13px; color:#ffb74d; word-break:break-all;">${req.wallet}</span>
                            <button style="padding:4px 8px; background:#444; color:#fff; border:none; cursor:pointer;" onclick="navigator.clipboard.writeText('${req.wallet}'); alert('تم النسخ بنجاح!')">نسخ</button>
                        </div>
                        <div class="action-buttons" style="${req.status !== 'معلق' ? 'display:none;' : ''}">
                            <button class="btn-status btn-approve" onclick="updateStatus(${req.id}, 'تم القبول')">موافق 👍</button>
                            <button class="btn-status btn-reject" onclick="updateStatus(${req.id}, 'تم الرفض')">رفض 👎</button>
                        </div>
                        <p style="font-size:12px; color:#aaa; margin-top:10px;">الحالة الحالية: <strong>${req.status}</strong> | التوقيت: ${req.date}</p>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }).catch(err => {
            document.getElementById('liveStatusBadge').innerText = '🔴 خطأ في الاتصال بالسيرفر';
            document.getElementById('liveStatusBadge').style.backgroundColor = '#b71c1c';
        });
    }

    function updateStatus(id, newStatus) {
        fetch(`${backupServerUrl}/update-status`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id: id, newStatus: newStatus })
        }).then(() => loadAdminRequests());
    }

    function broadcastTodayProfit() {
        fetch(`${backupServerUrl}/broadcast`, { method: 'POST' })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                alert(`🔥 تم بث أرباح الصفقة اليومية 15% بنجاح سحابي للمشتركين النشطين!`);
            } else {
                alert('⚠️ تعذر البث المالي لأن إجمالي رأس مال المشتركين صفر حالياً.');
            }
        });
    }

    function clearAllRequests() {
        if(confirm('هل أنت متأكد من تنظيف كافة السجلات نهائياً من السيرفر؟')) {
            fetch(`${backupServerUrl}/clear`, { method: 'POST' }).then(() => loadAdminRequests());
        }
    }

    setInterval(loadAdminRequests, 2000);
    window.onload = loadAdminRequests;
</script>
</body>
</html>
