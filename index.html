<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة التداول الذكية - حساب المشترك</title>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b0f19; color: #f3f4f6; }
    </style>
</head>
<body class="p-4 bg-gray-900">

    <div class="max-w-md mx-auto space-y-6 mt-4">
        <!-- الرصيد المباشر -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl text-center">
            <h1 class="text-xl font-bold text-blue-400 mb-2">🚀 مرحباً بك في منصة التداول</h1>
            <p class="text-gray-400 text-sm">رصيدك الحالي المحدث حياً:</p>
            <div class="text-3xl font-extrabold text-green-400 mt-1" id="userBalance">0.00 USDT</div>
            <div class="inline-block mt-3 px-3 py-1 bg-gray-700 text-xs rounded-full text-yellow-400">🤖 البوت: مستعد للإيداع</div>
        </div>

        <!-- صندوق الإيداع وعرض المحفظة -->
        <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
            <h2 class="text-lg font-bold text-yellow-500 mb-4">💰 طلب تفعيل وإيداع رصيد</h2>
            
            <div class="bg-gray-900 p-3 rounded-xl border border-gray-700 mb-4 text-center">
                <p class="text-xs text-gray-400 mb-1">عنوان محفظة الشركة الرسمي (USDT TRC-20):</p>
                <div class="bg-black p-2 rounded-lg text-xs font-mono text-yellow-400 break-all select-all">
                    TA1vsgrJEFy3YM6rkQWBppnZemFE6c9pBN
                </div>
            </div>

            <p class="text-xs text-gray-400 mb-4">تنبيّه: الحد الأدنى للإيداع هو <span class="text-yellow-500 font-bold">100 USDT</span>.</p>
            
            <div class="space-y-3">
                <input type="text" id="depUsername" placeholder="اسم المستخدم الخاص بك" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm focus:outline-none">
                <input type="number" id="depAmount" placeholder="المبلغ المحول (USDT)" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm focus:outline-none">
                <input type="text" id="depAddress" placeholder="عنوان محفظتك الشخصية" class="w-full bg-gray-900 border border-gray-700 rounded-xl p-3 text-white text-sm focus:outline-none">
                <button onclick="sendDeposit()" class="w-full bg-yellow-500 text-black font-bold p-3 rounded-xl">إرسال طلب الإيداع للمراجعة</button>
            </div>
            <div id="depMessage" class="text-xs mt-3 text-center font-bold"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://onrender.com"; 

        async function sendDeposit() {
            const username = document.getElementById('depUsername').value;
            const amount = document.getElementById('depAmount').value;
            const cryptoAddress = document.getElementById('depAddress').value;
            const msgDiv = document.getElementById('depMessage');

            if(!username || !amount || !cryptoAddress) {
                msgDiv.className = "text-xs mt-3 text-red-400";
                msgDiv.innerText = "❌ يرجى ملء جميع الحقول أولاً!";
                return;
            }

            if(Number(amount) < 100) {
                msgDiv.className = "text-xs mt-3 text-red-400";
                msgDiv.innerText = "❌ فشل: الحد الأدنى للإيداع هو 100 USDT!";
                return;
            }

            msgDiv.className = "text-xs mt-3 text-blue-400";
            msgDiv.innerText = "جاري إرسال البيانات بشكل آمن للسيرفر...";

            try {
                const response = await fetch(`${BACKEND_URL}/api/finance/deposit`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, amount, cryptoAddress })
                });
                const data = await response.json();
                
                if(response.ok) {
                    msgDiv.className = "text-xs mt-3 text-green-400";
                    msgDiv.innerText = "✅ " + data.message;
                } else {
                    msgDiv.className = "text-xs mt-3 text-red-400";
                    msgDiv.innerText = "❌ " + data.error;
                }
            } catch(err) {
                msgDiv.className = "text-xs mt-3 text-red-400";
                msgDiv.innerText = "❌ فشل الاتصال بالسيرفر المركزي الحي.";
            }
        }
    </script>
</body>
</html>
