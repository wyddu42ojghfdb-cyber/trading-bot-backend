<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - بث المعاملات الحية</title>
    <style>
        :root { --primary-color: #00c853; --danger-color: #b71c1c; --bg-color: #121212; --card-bg: #1e1e1e; --gold-color: #ffd600;}
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); color: #fff; padding: 20px; display: flex; justify-content: center; }
        .admin-container { width: 100%; max-width: 600px; background: var(--card-bg); padding: 30px; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
        .status-badge { display: inline-block; background: #1b5e20; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; margin-bottom: 15px; font-weight: bold; }
        .btn-broadcast { width: 100%; padding: 15px; background-color: var(--gold-color); color: #000; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(255,214,0,0.2); }
        .request-card { background: #2a2a2a; border-left: 4px solid var(--primary-color); padding: 18px; border-radius: 8px; margin-bottom: 15px; text-align: right; }
        .wallet-container { background: #111; padding: 10px; border-radius: 6px; margin: 12px 0; display: flex; justify-content: space-between; align-items: center; }
        .action-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-status { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-approve { background-color: #2e7d32; color: white; }
        .btn-reject { background-color: #c62828; color: white; }
        .btn-clear { width: 100%; padding: 12px; background: transparent; border: 1px solid var(--danger-color); color: var(--danger-color); border-radius: 8px; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div class="admin-container">
    <div style="text-align: center; margin-bottom: 20px;">
        <h2>لوحة تتبع المعاملات الحية بين الأجهزة</h2>
        <div id="orderCount" style="font-size: 14px; color: #4fc3f7; margin-bottom: 10px; font-weight: bold;">إجمالي طلبات المنصة: 0</div>
        <div class="status-badge">🟢 قناة ربط سحابية نشطة ودائمة</div>
    </div>

    <button class="btn-broadcast" onclick="broadcastTodayProfit()">📊 بث أرباح الصفقة اليومية (نسبة 15%)</button>
    <div id="requestsContainer"></div>
    <button class="btn-clear" onclick="clearAllRequests()">🗑️ تنظيف شاشة المراقبة وتصفير السجلات</button>
</div>

<script>
    // قناة ربط برمجية مشتركة ومفتوحة تعمل وسيطاً لنقل البيانات حياً بين الأجهزة المختلفة
    const channelUrl = 'https://jsonbin.io';
    const apiKey = '\$2a\$10\$7R4b6/nJv/GskcZ.vNlO2uTskK0Jq6b19H7H9YhM8rR4n3CExZ6vS'; // مفتاح عبور آمن مفتوح

    function checkAdminAuth() {
        if (sessionStorage.getItem('is_admin_auth') === 'true') {
            loadAdminRequests();
            setInterval(loadAdminRequests, 3000);
            return;
        }
        const user = prompt("اسم المستخدم للمشرف:");
        const pass = prompt("كلمة المرور السرية:");
        if (user === "admin" && pass === "admin123") {
            sessionStorage.setItem('is_admin_auth', 'true');
            loadAdminRequests();
            setInterval(loadAdminRequests, 3000);
        } else {
            alert("بيانات خاطئة!");
            window.location.href = "index.html";
        }
    }

    function loadAdminRequests() {
        fetch(channelUrl, { headers: { 'X-Master-Key': apiKey } })
        .then(res => res.json())
        .then(resData => {
            const serverData = resData.record || { orders: [], balances: { capital: 0, todayProfit: 0, inviteProfit: 0 } };
            const orders = serverData.orders || [];
            
            document.getElementById('orderCount').innerText = `إجمالي طلبات المنصة: ${orders.length}`;
            const container = document.getElementById('requestsContainer');
            container.innerHTML = '';

            if(orders.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#aaa; font-style:italic;">شاشات المراقبة نظيفة، لا توجد طلبات</p>';
                return;
            }

            [...orders].reverse().forEach((req, index) => {
                const actualIndex = orders.length - 1 - index;
                const typeColor = req.type.includes('سحب') ? '#ff5252' : '#00e676';
                
                const cardHtml = `
                    <div class="request-card" style="border-left-color: ${typeColor}">
                        <p><strong>اسم العضو:</strong> <span style="color: #4fc3f7; font-weight: bold;">${req.username || 'لاعب حقيقي'}</span></p>
                        <p><strong>نوع العملية:</strong> <span style="color: ${typeColor}">${req.type}</span></p>
                        <p><strong>المبلغ:</strong> ${req.amount} USDT</p>
                        <div class="wallet-container">
                            <span style="font-size:13px; color:#ffb74d; word-break:break-all;">${req.wallet}</span>
                            <button style="padding:4px 8px; background:#444; color:#fff; border:none; cursor:pointer;" onclick="navigator.clipboard.writeText('${req.wallet}'); alert('تم النسخ!')">نسخ</button>
                        </div>
                        <div class="action-buttons" style="${req.status !== 'معلق' ? 'display:none;' : ''}">
                            <button class="btn-status btn-approve" onclick="updateStatus(${actualIndex}, 'تم القبول', '${req.type}', ${req.amount}, serverData)">موافق 👍</button>
                            <button class="btn-status btn-reject" onclick="updateStatus(${actualIndex}, 'تم الرفض', '${req.type}', ${req.amount}, serverData)">رفض 👎</button>
                        </div>
                        <p style="font-size:12px; color:#aaa; margin-top:10px;">الحالة: <strong>${req.status}</strong> | التوقيت: ${req.date}</p>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        });
    }

    function updateStatus(index, newStatus, type, amount, serverData) {
        serverData.orders[index].status = newStatus;

        if (newStatus === 'تم القبول') {
            let bal = serverData.balances || { capital: 0, todayProfit: 0, inviteProfit: 0 };
            const num = parseFloat(amount) || 0;
            if (type === 'إيداع') bal.capital += num;
            else if (type === 'سحب كلّي') bal.capital = 0;
            else if (type === 'سحب اليوم') bal.todayProfit -= num;
            serverData.balances = bal;
        }

        saveToServer(serverData);
    }

    function broadcastTodayProfit() {
        fetch(channelUrl, { headers: { 'X-Master-Key': apiKey } })
        .then(res => res.json())
        .then(resData => {
            let serverData = resData.record;
            let bal = serverData.balances || { capital: 0, todayProfit: 0, inviteProfit: 0 };
            if (bal.capital <= 0) return alert('رأس مال المشتركين صفر!');
            
            const profit = bal.capital * 0.15;
            bal.todayProfit += profit;
            serverData.balances = bal;

            saveToServer(serverData, `🎯 تم بث أرباح الـ 15% بمجموع مضاف: ${profit.toFixed(2)} USDT`);
        });
    }

    function clearAllRequests() {
        if(confirm('هل تريد تصفير اللوحة؟')) {
            const freshData = { orders: [], balances: { capital: 0, todayProfit: 0, inviteProfit: 0 } };
            saveToServer(freshData);
        }
    }

    function saveToServer(data, alertMsg = null) {
        fetch(channelUrl, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'X-Master-Key': apiKey },
            body: JSON.stringify(data)
        }).then(() => {
            loadAdminRequests();
            if(alertMsg) alert(alertMsg);
        });
    }

    window.onload = checkAdminAuth;
</script>
</body>
</html>
