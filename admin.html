<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم المشرف - مراقبة المعاملات الحية</title>
    <style>
        :root {
            --primary-color: #00c853;
            --danger-color: #b71c1c;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --gold-color: #ffd600;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #3a3a3a;
            padding-bottom: 15px;
        }

        .admin-header h1 {
            font-size: 24px;
            color: var(--primary-color);
            margin: 0 0 5px 0;
        }

        .admin-header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }

        .status-badge {
            display: inline-block;
            background: #1b5e20;
            color: #fff;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 10px;
            font-weight: bold;
        }

        .btn-broadcast {
            width: 100%;
            padding: 15px;
            background-color: var(--gold-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(255, 214, 0, 0.2);
        }

        .btn-broadcast:hover { background-color: #ffea00; }

        .requests-list {
            margin-top: 20px;
            min-height: 150px;
        }

        .request-card {
            background: #2a2a2a;
            border-left: 4px solid var(--primary-color);
            padding: 18px;
            border-radius: 8px;
            margin-bottom: 15px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: right;
        }

        .request-card.withdraw-type {
            border-left-color: var(--danger-color);
        }

        .request-card p {
            margin: 8px 0;
            font-size: 15px;
        }

        .wallet-container {
            background: #111;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3a3a3a;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .wallet-text {
            font-family: monospace;
            font-size: 14px;
            color: #ffb74d;
            word-break: break-all;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-status {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            font-size: 14px;
        }

        .btn-approve { background-color: #2e7d32; color: white; }
        .btn-approve:hover { background-color: #1b5e20; }
        
        .btn-reject { background-color: #c62828; color: white; }
        .btn-reject:hover { background-color: #b71c1c; }

        .request-meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 12px;
            border-top: 1px solid #3a3a3a;
            padding-top: 8px;
        }

        .btn-clear {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--danger-color);
            color: var(--danger-color);
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 20px;
        }

        .btn-clear:hover { background: var(--danger-color); color: #fff; }

        .empty-message {
            text-align: center;
            color: var(--text-muted);
            padding: 40px 0;
            font-style: italic;
        }

        .copy-btn {
            background: #0088cc;
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <h1>لوحة تتبع المعاملات الحية</h1>
        <div id="orderCount" style="font-size: 14px; color: #4fc3f7; margin-bottom: 10px; font-weight: bold;">إجمالي طلبات المنصة: 0</div>
        <div id="liveStatus" class="status-badge" style="background-color: #1b5e20;">🟢 متصل ومستقر 100% (اتصال حي)</div>
    </div>

    <!-- 📊 زر توزيع أرباح الـ 15% المباشر للبث السحابي -->
    <button class="btn-broadcast" onclick="broadcastTodayProfit()">📊 بث أرباح الصفقة اليومية (نسبة 15%)</button>

    <!-- قائمة عرض الطلبات المستلمة حياً -->
    <div class="requests-list" id="requestsContainer">
        <div class="empty-message">شاشات المراقبة نظيفة، لا توجد طلبات معلقة حالياً</div>
    </div>

    <!-- زر تنظيف اللوحة -->
    <button class="btn-clear" onclick="clearAllRequests()">🗑️ تنظيف شاشة المراقبة ومسح السجلات</button>
</div>

<script>
    // 🌐 شبكة ربط برمجية دائمة ومجانية ومستقرة تماماً تتبع لجوجل لمنع الأخطاء الحمراء
    const dbUrl = 'https://firebaseio.com';

    function checkAdminAuth() {
        const correctUser = "admin";
        const correctPass = "admin123";

        // فحص الجلسة إذا كان والدك مسجل الدخول بالفعل
        if (sessionStorage.getItem('is_logged_in') === 'true') {
            loadAdminRequests();
            setInterval(loadAdminRequests, 2500);
            return;
        }

        const inputUser = prompt("الرجاء إدخال اسم المستخدم للمشرف:");
        const inputPass = prompt("الرجاء إدخال كلمة المرور السرية:");

        if (inputUser === correctUser && inputPass === correctPass) {
            sessionStorage.setItem('is_logged_in', 'true');
            loadAdminRequests();
            setInterval(loadAdminRequests, 2500);
        } else {
            alert("❌ بيانات الدخول خاطئة!");
            window.location.href = "index.html"; 
        }
    }

    function loadAdminRequests() {
        fetch(`${dbUrl}/orders.json`)
        .then(res => res.json())
        .then(data => {
            const container = document.getElementById('requestsContainer');
            container.innerHTML = '';
            
            if(!data) { 
                document.getElementById('orderCount').innerText = "إجمالي طلبات المنصة: 0";
                container.innerHTML = '<div class="empty-message">شاشات المراقبة نظيفة، لا توجد طلبات معلقة حالياً</div>'; 
                return; 
            }

            const keys = Object.keys(data);
            document.getElementById('orderCount').innerText = `إجمالي طلبات المنصة: ${keys.length}`;

            keys.reverse().forEach(key => {
                const req = data[key];
                const isWithdraw = req.type && req.type.includes('سحب');
                const cardClass = isWithdraw ? 'request-card withdraw-type' : 'request-card';
                const typeColor = isWithdraw ? '#ff5252' : '#00e676';
                
                let statusIcon = '⏳';
                let statusColor = '#fff';
                if (req.status === 'تم القبول') { statusIcon = '✅'; statusColor = '#00e676'; }
                if (req.status === 'تم الرد') { statusIcon = '❌'; statusColor = '#ff5252'; }

                const cardHtml = `
                    <div class="${cardClass}">
                        <p><strong>اسم العضو:</strong> <span style="color: #4fc3f7; font-weight: bold;">${req.username || 'لاعب حقيقي'}</span></p>
                        <p><strong>نوع العملية:</strong> <span style="color: ${typeColor}; font-weight: bold;">${req.type}</span></p>
                        <p><strong>المبلغ المطلوب:</strong> <span style="font-size: 18px; font-weight: bold; color: #fff;">${req.amount} USDT</span></p>
                        
                        <div class="wallet-container">
                            <div class="wallet-text">${req.wallet}</div>
                            <button class="copy-btn" onclick="navigator.clipboard.writeText('${req.wallet}'); alert('تم نسخ عنوان المحفظة بنجاح!')">📋 نسخ</button>
                        </div>

                        <div class="action-buttons" style="${req.status !== 'معلق' ? 'display:none;' : ''}">
                            <button class="btn-status btn-approve" onclick="updateStatus('${key}', 'تم القبول', '${req.type}', ${req.amount})">موافق 👍</button>
                            <button class="btn-status btn-reject" onclick="updateStatus('${key}', 'تم الرفض')">رفض 👎</button>
                        </div>

                        <div class="request-meta">
                            <span>حالة الطلب: <span style="color: ${statusColor}; font-weight: bold;">${statusIcon} ${req.status}</span></span>
